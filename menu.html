<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1d4a">
<meta name="robots" content="noindex">
<title>Menu</title>
<style>
:root{--gold:#f6c453;--cream:#fff4dc;--bg1:#14306e;--bg2:#06112e;--card:rgba(255,255,255,.06);--line:rgba(246,196,83,.35)}
*{box-sizing:border-box}
html{background:#06112e}
body{margin:0;min-height:100vh;color:var(--cream);background:radial-gradient(ellipse at 50% 0%,var(--bg1) 0%,var(--bg2) 70%) fixed;font:17px/1.45 Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:26px 18px 40px}
.top{text-align:center;margin-bottom:14px}
.g{font:700 .8rem/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.9}
h1{margin:.25rem 0 .1rem;font:700 2.5rem/1.1 "Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery",cursive;color:var(--cream);text-shadow:0 0 14px rgba(255,184,77,.8),0 3px 6px rgba(0,0,0,.6)}
.ev{font-weight:700;margin-top:.2rem}.meta{opacity:.85;font-size:.95rem;margin-top:.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 12px;margin-top:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mh{color:var(--gold);font-weight:800;font-size:1.25rem;text-align:center;margin:.9rem 0 .25rem;text-shadow:0 0 10px rgba(255,184,77,.5)}
.mh:first-child{margin-top:.1rem}
.mi{text-align:center;padding:.1rem 0}
.orn{text-align:center;color:var(--gold);opacity:.8;font-size:.9rem;line-height:1}
.sc .mh{font:700 1.8rem/1.15 "Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery",cursive}
.mo .mh{font-family:"Avenir Next",Avenir,"Trebuchet MS",Arial,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:1rem}.mo .mi{font-family:"Avenir Next",Avenir,"Trebuchet MS",Arial,sans-serif}
.ch,.ch .mh{font-family:"Chalkboard SE","Marker Felt","Comic Sans MS",cursive}
h2{margin:0 0 .5rem;text-align:center;color:var(--gold);font-size:1.2rem}
table{width:100%;border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:.95rem}
th,td{padding:.55rem .4rem;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
th{color:var(--gold);font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
.foot{text-align:center;opacity:.6;font-size:.8rem;margin-top:22px;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.msg{text-align:center;margin-top:60px}
.pic{margin-top:14px;border-radius:18px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.5)}.pic img{display:block;width:100%;height:auto}
.pr{margin:.2rem 0 .8rem}.pr:last-child{margin-bottom:.2rem}.pr-h{font-weight:800;color:var(--gold);margin:0 0 .3rem;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.pr-l{display:flex;justify-content:space-between;gap:.8rem;padding:.45rem .1rem;border-bottom:1px solid var(--line);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;font-size:1rem}.pr-l b{white-space:nowrap;font-size:1.1rem}
.tip{text-align:center;font:.8rem -apple-system,Arial,sans-serif;opacity:.6;margin:.4rem 0 0}
.txt{margin-top:12px}.txt summary{cursor:pointer;text-align:center;color:var(--gold);font-family:-apple-system,Arial,sans-serif;font-size:.9rem;padding:.4rem}

/* animations (2.82.25) */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx i{position:absolute;top:-40px;font-style:normal;opacity:.85;animation:fxFall linear infinite;text-shadow:0 0 6px rgba(255,255,255,.8)}
@keyframes fxFall{to{transform:translate3d(var(--dx,20px),110vh,0) rotate(360deg)}}
#fx b{position:absolute;top:8%;left:-30%;width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,#fde68a);box-shadow:0 0 10px #fde68a;transform:rotate(18deg);animation:fxStar 7s ease-in 1.5s infinite}
@keyframes fxStar{0%{left:-30%;top:4%;opacity:0}8%{opacity:1}22%{left:120%;top:26%;opacity:0}100%{left:120%;top:26%;opacity:0}}
.top{background-size:220% 220%!important;animation:fxPan 9s ease-in-out infinite}
@keyframes fxPan{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.top h1{animation:fxPop .9s cubic-bezier(.2,1.6,.4,1) both}.top p,.top small,.top .ev,.top .meta,.top .g{animation:fxUp .8s .25s ease both}
@keyframes fxPop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}@keyframes fxUp{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.go{animation:fxGlow 2.4s ease-in-out infinite}@keyframes fxGlow{0%,100%{box-shadow:0 6px 18px rgba(124,58,237,.25)}50%{box-shadow:0 8px 28px rgba(219,39,119,.55)}}
.ok b{display:inline-block;animation:fxBounce 1s cubic-bezier(.2,1.8,.4,1) both}@keyframes fxBounce{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;border-radius:2px;animation:fxCf 2.6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fxCf{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){#fx,.cf{display:none}.top,.top h1,.top *,.go,.ok b{animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="w"><p class="msg">Chargement du menu…</p></div>
<script>
(function(){
var API='https://agendam-famille.dam-cigogne.workers.dev',W=document.getElementById('w');
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function eur(n){n=+n||0;return n?(Math.round(n*100)/100).toString().replace('.',',')+' €':'—'}
function parse(t){var out=[],cur=null;String(t||'').replace(/\r/g,'').split('\n').forEach(function(l){var x=l.trim();if(!x)return;var m=x.match(/^([^:\-•*–][^:]{0,40}?)\s*:\s*(.*)$/);if(m&&!/^[-•*–]/.test(x)){cur={h:m[1].trim(),L:[]};out.push(cur);x=m[2].trim();if(!x)return}x=x.replace(/^[-•*–]\s*/,'');if(!cur){cur={h:'',L:[]};out.push(cur)}cur.L.push(x)});return out}
var id=(location.hash||'').slice(1);
if(!/^[0-9a-f]{32}$/.test(id)){W.innerHTML='<p class="msg">Lien du menu incomplet. Scanne à nouveau le QR code.</p>';return}
fetch(API+'/pub/'+id,{cache:'no-store'}).then(function(r){if(r.status===404)throw new Error('pas encore publié');if(!r.ok)throw new Error('erreur '+r.status);return r.json()}).then(function(j){
 var d=j.d||{},S=parse(d.mn),dd='';
 try{if(d.d){var D=new Date(d.d+'T12:00:00');dd=D.toLocaleDateString('fr-FR',{weekday:'long'})+' '+(D.getDate()===1?'1er':D.getDate())+' '+D.toLocaleDateString('fr-FR',{month:'long'});dd=dd.charAt(0).toUpperCase()+dd.slice(1)}}catch(e){}
 document.title=(d.mt||'Menu')+(d.t?' · '+d.t:'');
 setTimeout(function(){try{fxStart((d.t||'')+' '+(d.mt||''),d.th)}catch(e){}},0);
 var cls=d.mnf==='sc'?'sc':d.mnf==='mo'?'mo':d.mnf==='ch'?'ch':'';
 var h='<div class="top">'+(d.g?'<div class="g">'+esc(d.g)+'</div>':'')+'<h1>'+esc(d.mt||('Menu'+(/noel/.test(d.th||'')?' de Noël':'')))+'</h1>'+(d.t?'<div class="ev">'+esc(d.t)+'</div>':'')+'<div class="meta">'+[dd?'📅 '+esc(dd)+(d.hr?' · '+esc(d.hr):''):'',d.pl?'📍 '+esc(d.pl):''].filter(Boolean).join('<br>')+'</div></div>';
 if(d.img)h+='<div class="pic"><img src="'+String(d.img).replace(/"/g,'')+'" alt="Menu"></div><p class="tip">Écarte deux doigts pour agrandir</p>';
 h+=(d.img?'<details class="txt"><summary>Version texte du menu</summary>':'')+'<div class="card '+cls+'">'+(S.length?S.map(function(x){return (x.h?'<div class="mh">'+esc(x.h)+'</div><div class="orn">❦</div>':'')+x.L.map(function(v){return '<div class="mi">'+esc(v)+'</div>'}).join('')}).join(''):'<p class="mi"><i>Le menu arrive bientôt…</i></p>')+'</div>';
 if(d.img)h+='</details>';
 if(d.p&&d.p.length){var hc=d.p.some(function(r){return r[3]!=null}),he=d.p.some(function(r){return r[4]!=null}),pv=function(v){return v==null?'':(+v?eur(v):'Gratuit')};
  h+='<div class="card"><h2>💶 Tarifs</h2>'+d.p.map(function(r){var L=[['🎖 Amicaliste',eur(r[1])]];if(hc&&r[3]!=null)L.push(['🤝 Accompagnant d’un amicaliste',pv(r[3])]);L.push(['👤 Non-amicaliste',eur(r[2])]);if(he&&r[4]!=null)L.push(['🧒 Enfant',pv(r[4])]);
   return '<div class="pr"><div class="pr-h">'+esc(r[0])+'</div>'+L.map(function(x){return '<div class="pr-l"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('')+'</div>'}).join('')+'</div>'}
 h+='<div class="foot">Mis à jour le '+esc(new Date(j.at).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+'</div>';
 W.innerHTML=h;
}).catch(function(e){W.innerHTML='<p class="msg">Menu indisponible pour l’instant ('+esc(e&&e.message||'connexion')+'). Réessaie dans un moment.</p>'});
})();
</script>
<script>
/* animations (2.82.25) : décor selon l'événement (neige à Noël, raisins au Beaujolais, médailles à la Saint-Éloi…), étoile filante, confettis */
function fxTheme(t,th){t=String(t||'').toLowerCase();th=String(th||'');var R=[
 ['eloi',/[ée]loi|militaire|c[ée]r[ée]monie|14 juillet|armistice|11 novembre|8 mai|r[ée]giment|prise d.armes|d[ée]fil[ée]/,['🎖️','⭐','✦','🎖️','✦'],['#1d4ed8','#ffffff','#dc2626']],
 ['vin',/beaujolais|vin\b|vins|vendange|[œo]e?nolog|d[ée]gustation|\bcave\b|ap[ée]ro|ap[ée]ritif/,['🍇','🍷','🥂','🍇','🧀'],0],
 ['galette',/galette|\brois\b|[ée]piphanie/,['👑','🥧','✨','👑','🥂'],0],
 ['hallo',/halloween/,['🎃','👻','🦇','🍬','🎃'],0],
 ['paques',/p[âa]ques/,['🥚','🐣','🌷','🍫','🐰'],0],
 ['crepe',/chandeleur|cr[êe]pe/,['🥞','✨','🍯','🥞'],0],
 ['noel',/no[eë]l|r[ée]veillon|hiver|neige|sapin|nouvel an|saint[- ]sylvestre/,['❄','❅','❆','✦'],['#ffffff','#a5b4fc']],
 ['bbq',/barbecue|bbq|grillade|m[ée]choui|plancha|paella/,['🔥','🍖','🌭','🍉','🍔'],0],
 ['anniv',/anniversaire|d[ée]part|retraite|mariage|naissance|bapt[êe]me|mutation/,['🎈','🥂','🎉','🎁'],0],
 ['repas',/casse[- ]?cro[uû]te|midi|d[ée]jeuner|repas|buffet|d[îi]ner|banquet|pique[- ]nique|\bpot\b/,['🥖','🧀','🥪','🍷','☕'],0],
 ['loto',/loto|tombola|bingo|quine/,['🎱','🍀','🎁','⭐'],0],
 ['sport',/foot|match|tournoi|sport|course|rando|p[ée]tanque|cross|v[ée]lo|marche/,['🏆','⚽','🥇','🏅'],0],
 ['disco',/dansante|disco|\bbal\b|\bdj\b|karaok|soir[ée]e/,['🎵','🪩','💃','🕺','✨'],0],
 ['enfant',/enfant|kid|go[ûu]ter/,['🎈','🧸','🍭','🎨'],0],
 ['ete',/[ée]t[ée]\b|plage|piscine|juillet|ao[ûu]t|soleil/,['☀️','🌴','🍉','🍦'],0],
 ['adh',/adh[ée]sion|amicale/,['🎖️','✨','⭐','✨'],0]];
 var TH={noel:'noel',noelf:'noel',galette:'galette',loto:'loto',lotof:'loto',repas:'repas',bbq:'bbq',hallo:'hallo',disco:'disco',nuit:'disco',sport:'sport',enfants:'enfant',ete:'ete'};
 for(var k=0;k<R.length;k++)if(R[k][1].test(t))return {k:R[k][0],e:R[k][2],c:R[k][3]};
 if(TH[th])for(var j=0;j<R.length;j++)if(R[j][0]===TH[th])return {k:R[j][0],e:R[j][2],c:R[j][3]};
 var m=new Date().getMonth();if(m===11||m===0)return {k:'noel',e:R[6][2],c:R[6][3]};
 return {k:'fete',e:['✨','🎉','⭐','🎊'],c:['#f59e0b','#ec4899','#8b5cf6','#10b981']}}
function fxStart(t,th){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;var T=fxTheme(t,th),old=document.getElementById('fx');if(old)old.remove();var fx=document.createElement('div');fx.id='fx';var n=window.innerWidth<500?16:26,h='';
 for(var k=0;k<n;k++){h+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;font-size:'+(T.c?10+Math.random()*16:14+Math.random()*14).toFixed(0)+'px;animation-duration:'+(7+Math.random()*9).toFixed(1)+'s;animation-delay:-'+(Math.random()*14).toFixed(1)+'s;--dx:'+(Math.random()*80-40).toFixed(0)+'px'+(T.c?';color:'+T.c[k%T.c.length]:'')+'">'+T.e[k%T.e.length]+'</i>'}
 fx.innerHTML=h+'<b></b>';document.body.appendChild(fx)}catch(e){}}
fxStart(document.title);
function fxBoom(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;var C=['#7c3aed','#db2777','#f59e0b','#10b981','#3b82f6','#ef4444'];for(var k=0;k<90;k++){var d=document.createElement('i');d.className='cf';d.style.left=(Math.random()*100)+'%';d.style.background=C[k%C.length];d.style.animationDelay=(Math.random()*.6)+'s';d.style.setProperty('--dx',(Math.random()*160-80).toFixed(0)+'px');d.style.setProperty('--r',(Math.random()*900-450).toFixed(0)+'deg');document.body.appendChild(d);(function(x){setTimeout(function(){x.remove()},3600)})(d)}}catch(e){}}
</script>
</body>
