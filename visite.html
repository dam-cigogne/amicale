<style>
:root{--ac:#7c3aed;--ac2:#a78bfa;--y:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1f1830;background:radial-gradient(circle at 20% 10%,#7c3aed 0,#4c1d95 45%,#1e1238 100%);user-select:none;-webkit-user-select:none;touch-action:manipulation}

#phone{position:relative;height:100%;aspect-ratio:390/844;max-width:100%;border-radius:2.2rem;background:#111;padding:.55rem;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.12) inset}
#scr{position:relative;width:100%;height:100%;border-radius:1.7rem;overflow:hidden;background:#fff}
#zw{position:absolute;left:0;top:0;width:100%;aspect-ratio:390/844;transition:transform .45s ease}
#zw.paper{aspect-ratio:794/1123;background:#fff}#zw.paper img{object-fit:contain;object-position:top}
body.paperon:not(.crop) #phone{aspect-ratio:794/1123;padding:0;background:none;border-radius:.3rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
body.paperon:not(.crop) #scr{border-radius:.3rem}
#scr img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:opacity .25s}
#hole{position:absolute;border-radius:.8rem;box-shadow:0 0 0 9999px rgba(20,8,40,.55);transition:all .45s cubic-bezier(.3,1.3,.5,1);pointer-events:none}

#bub{position:fixed;z-index:15;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-transform:translateZ(0);isolation:isolate;-webkit-text-size-adjust:100%;text-size-adjust:100%;width:min(330px,92%);background:#fff;border-radius:1.1rem;padding:.8rem .9rem .7rem;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:left .45s cubic-bezier(.3,1.3,.5,1),top .45s cubic-bezier(.3,1.3,.5,1);animation:pop .4s cubic-bezier(.3,1.5,.5,1)}

#bub.dn:before{top:-7px}#bub.up:before{bottom:-7px}
#bub.lf:before{left:-7px;top:var(--ty,50%);transform:translateY(-50%) rotate(45deg)}

body.land #phone{margin-right:min(44vw,700px)}
/* téléphone couché (écran bas) : l'écran de l'appli devient une fenêtre zoomée sur la zone montrée */
body.crop #stage{padding:calc(env(safe-area-inset-top) + .6rem) .6rem calc(env(safe-area-inset-bottom) + .6rem) calc(env(safe-area-inset-left) + .6rem);justify-content:flex-start}
body.crop #phone{aspect-ratio:auto;height:100%;width:58vw;margin-right:0;border-radius:1rem;padding:0;background:none;box-shadow:0 12px 40px rgba(0,0,0,.45)}
body.crop #scr{border-radius:1rem}
body.crop #hint{display:none}
body.crop #top{left:auto;right:calc(env(safe-area-inset-right) + .5rem);top:auto;bottom:calc(env(safe-area-inset-bottom) + .4rem);padding:0;width:auto}
body.crop #chip,body.crop #bar{display:none}
body.crop #top .ib{min-width:2rem;height:2rem;font-size:.9rem}
body.crop #fs{display:none}

.conf{position:fixed;top:-3rem;font-size:1.8rem;z-index:35;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

  ['g05-fiche','ok','Rejoindre !','C’est tout. Les échanges du groupe sont <b>chiffrés</b> 🔒'],

  ['g06-membres','*','Qui voit quoi ? · Admin','<b>L’admin</b> (le président) voit <b>tout</b> : il invite, donne les titres, passe quelqu’un en aide, retire quelqu’un, et gère le modèle de bulletin et les tarifs.'],
  ['g06-membres','*','Qui voit quoi ? · Bureau','<b>Le bureau</b> voit tout : membres, agenda, tâches, courses, notes, amicalistes, bulletins d’adhésion. Il peut inviter des aides, et lit le modèle de bulletin.'],
  ['g06-membres','*','Qui voit quoi ? · Aide','<b>Un aide</b> voit seulement ce qu’on partage avec lui : membres, agenda, tâches, courses, événements. Jamais les amicalistes, les bulletins ni les notes.'],
  ['g32-lier','lier','📲 Plusieurs appareils','Chacun peut avoir l’appli sur son téléphone, son iPad et son PC : ⚙ › « Lier un autre appareil ». C’est toi, mêmes droits. Dans AgenDam, le même code relie aussi ton agenda perso.'],
  ['g33-lier-code','dlg','Le code de liaison','Sur l’autre appareil : ouvre Amicale › « Rejoindre avec un code », tape ce code. Tout se synchronise tout seul. Code personnel, 15 minutes : ne le donne à personne.']]},
 {em:'🎖',t:'Les amicalistes',p:'La liste des adhérents : importer votre fichier, inscrire, faire signer le bulletin d’adhésion, retrouver les numéros de badge.',s:[
  ['a17-am-outils','imp','📥 Importer des listes d’amicalistes','On peut importer des listes d’amicalistes (Excel, Word, texte). Exemple avec un fichier Excel, importé tel quel : grades abrégés (SGC, ADC…), badge, paiement, « 29/07 DAMIEN », patch OK. Réimporter met à jour, sans doublon.'],
  ['a17-am-outils','dbl','🧹 Retirer les doublons','Deux fiches pour la même personne ? Une seule est gardée, avec toutes les infos.'],
  ['g07-ajout-amicaliste','nom','Nouvel amicaliste','Onglet <span class="k">Amicalistes</span> › <span class="k">+ Ajouter</span>. Nom en MAJUSCULES, c’est plus lisible.'],
  ['g07-ajout-amicaliste','grade','Grade, catégorie…','Grade, catégorie, adhésion, cotisation, patch… et en bas « faire signer le bulletin d’adhésion ».'],
  ['a22-fiche-badge','bg','Dans la fiche','N° de badge, payée le, encaissé par (rempli tout seul quand on encaisse), service, régime.'],
  ['e4-fiche-contact','tel','📞 Téléphone et ✉️ mail','Dans la fiche de l’amicaliste (Modifier) : son téléphone et son mail. Ils s’affichent sous son nom, pour l’appeler ou lui écrire.'],
  ['g07-ajout-amicaliste','regime','Régime particulier','Halal, végétarien, allergie : il ressortira en orange dans les repas. 🍽'],
  ['g08-signature','prix','Le prix se calcule tout seul','D’après le grade : les tarifs sont réglés <b>une fois</b> par l’administrateur pour tout le bureau.'],
  ['g08-signature','pm','Le règlement','Carte, espèces, chèque ou virement.'],
  ['g08-signature','sig','Signature au doigt ✍️','On tend le téléphone, il signe. « Effacer » pour recommencer.'],
  ['g08-signature','ok','Valider','Le bulletin d’adhésion est rangé dans la fiche et envoyé au bureau (pas aux aides). Ensuite : envoyer, imprimer ou enregistrer le PDF.'],
  ['g09-amicaliste-signe','fiche','Et voilà !','« cotisation ✓ 20 € (CB) · bulletin d’adhésion ✓ · <b>inscrit par Claire Moreau</b> ». On sait qui a fait quoi.'],
  ['a17-am-outils','bg','🪪 Numéros de badge','On peut extraire le numéro de badge de <b>tous les amicalistes</b>, de <b>ceux inscrits à un événement</b>, ou de <b>ceux qui ont payé leur cotisation</b>.'],
  ['a18-badges','tab','Le listing','Nom, prénom, grade, N° de badge. En orange : ceux qui n’ont pas de badge.'],
  ['a18-badges','copy','📋 Copier','Les numéros à coller dans la demande de repas. Ou 📊 Excel, ou 🖨 imprimer.'],
  ['a17-am-outils','fill','📋 Compléter une liste Excel','Exemple : pour un repas, les gens s’inscrivent sur un Excel avec seulement NOM et Prénom.'],
  ['a34-fill-intro','dlg','On donne le fichier à l’appli','Elle retrouve chaque personne dans la liste des amicalistes, même si le nom est écrit dans le désordre ou sans accents.'],
  ['a33-fill-ok','dlg','Un Excel complet','Elle ajoute pour chacun : grade, N° de badge, amicaliste oui/non, cotisation payée, régime, service. Ceux qu’elle ne trouve pas sont signalés. Prêt pour la demande de repas.']]},
 {em:'🗄',t:'Archiver les bulletins d’adhésion',p:'Une fois par an, l’administrateur range tous les bulletins d’adhésion signés dans un seul fichier.',s:[
  ['g11-archiver','zip','Un ZIP de PDF','Un PDF par personne, nommé <b>NOM-Prénom</b>. Sur iPhone : « Enregistrer dans Fichiers ».'],
  ['g12-liberer','lib','Libérer la place','Seulement quand le ZIP est bien rangé : les signatures quittent tous les téléphones.'],
  ['g13-archive','fiche','La fiche reste','Elle garde « 📝 bulletin d’adhésion archivé ». La liste ne perd rien.']]},
 {em:'🛒',t:'Tâches et courses',p:'Qui fait quoi ? Ça se voit d’un coup d’œil.',s:[
  ['g14-taches','add','Une tâche','Quoi, <b>pour qui</b> 👤, pour quand 📅, bureau seulement 🔒 ou tout le monde.'],
  ['g14-taches','t1','Qui s’en occupe','👤 la personne chargée, ✍️ celle qui l’a écrite.'],
  ['g14-taches','done','Faites ✅','On coche, elle passe dans « Faites » avec le nom de celui qui l’a cochée.'],
  ['g15-courses','plus','Les courses','Plusieurs listes (Courses, Buvette, Local…), rangées par rayon, quantités avec − et +.'],
  ['g15-courses','done','Dans le chariot 🛒','Au magasin on coche : « ✅ Luc Martin ». Personne n’achète deux fois la même chose !'],
  ['g15b-cloche','cloche','🔔 La cloche','Tu pars faire les courses ? Touche la cloche : <b>les notifications des courses sont coupées pendant 1 heure</b>. Les autres ne reçoivent plus un message à chaque article que tu coches.'],
  ['g15c-cloche-coupee','cloche','🔕 Coupées pour 1 heure','Le bouton indique jusqu’à quelle heure. Les courses se synchronisent toujours normalement. <b>Les notifications reviennent toutes seules</b> avec le message « Notifications réactivées ». Tu peux aussi retoucher pour les réactiver plus tôt.']]},
 {em:'🎄',t:'La soirée de Noël',p:'De la préparation au soir même : inscrits, argent, régimes, cadeaux, affiche, Jour J.',s:[
  ['g16-evenements','noel','Un événement','Onglet <span class="k">Événements</span> : la soirée du 19 décembre, avec sa préparation ✅ 3/7.'],
  ['g17-noel-preparation','infos','Les infos','Date, lieu, description, visible par le bureau seul ou aussi par les aides.'],
  ['g17-noel-preparation','fait','La préparation','Chaque ligne a son responsable. Quand c’est fait : « ✅ <b>fait par Luc Martin</b> » et l’heure.'],
  ['e6-taches-selection','bar','☑ Sélectionner des tâches','Dans la préparation : on touche ☑ Sélectionner des tâches, on coche plusieurs lignes. En haut : le nombre choisi, « Tout » ou « Aucune ».'],
  ['e6-taches-selection','don','👤 Donner à…','Confier toutes les tâches choisies à une même personne, en une fois.'],
  ['e6-taches-selection','rap','📨 Envoyer un rappel','Un message de rappel pour les personnes concernées.'],
  ['e6-taches-selection','del','🗑 Supprimer','Retirer plusieurs tâches d’un coup.'],
  ['g18-import-liste','coller','Importer une liste','Colle une liste depuis Word, Notes ou un mail, ou choisis un fichier Excel/Word. 📥'],
  ['g19-noel-inscrits','stats','Les totaux','Présents, tickets, et <b>l’argent encaissé</b> par CB, espèces, chèques, virements. 💶'],
  ['g19-noel-inscrits','regimes','Régimes en orange','Halal, végétarien, allergie : à donner au traiteur.'],
  ['g19-noel-inscrits','p1','Chaque inscrit','Amicalistes et non-amicalistes triés tout seuls. 2 repas pour un couple.'],
  ['g22-import-inscrits','noms','Ajouter des noms','Une liste collée : ceux qui sont amicalistes sont reconnus tout seuls.'],
  ['e2-selection','tabs','Deux onglets d’inscrits','Dans la fiche de l’événement : <span class="k">🎖 Amicalistes</span> et <span class="k">👤 Non-amicalistes</span>, chacun avec son nombre.'],
  ['e2-selection','bar','☑ Sélectionner des inscrits','On touche ☑ Sélectionner, on coche des personnes : en haut, le nombre choisi, « Tout » ou « Aucun ».'],
  ['e2-selection','pres','✅ Présent · 💶 Payé en avance','Marquer d’un coup toutes les personnes choisies comme présentes, ou comme ayant payé en avance.'],
  ['e2-selection','inv','📨 Invitation · 📤 Exporter','Envoyer une invitation (SMS groupé ou mail) ou exporter la sélection.'],
  ['e2-selection','del','🗑 Retirer de la liste','Pour enlever plusieurs inscrits en une fois.'],
  ['g20-noel-distribution','ty','Ce qu’on distribue','Pour Noël : ✅ Arrivé, 🍽 Repas, 🍷 Boisson, 🎁 Cadeau… ou tes propres rubriques.'],
  ['g20-noel-distribution','cadeau','+1 pour tous 🎁','On touche le bouton : ça ajoute <b>un cadeau à tout le monde</b>. Les boutons d’à côté font pareil pour l’arrivée, le repas et la boisson.'],
  ['g20-noel-distribution','exp','Exporter (Excel)','La liste complète pour le traiteur ou le trésorier, régimes compris.'],
  ['g37-paiement','bar','💶 Qui a payé ?','Facultatif : on met les tarifs (20 € le repas amicaliste, 25 € non-amicaliste…). À encaisser, encaissé, reste : tout se calcule.'],
  ['g37-paiement','no','Chacun sa ligne','🔴 à payer, 🟠 reste à payer, ✅ payé, avec qui a encaissé.'],
  ['g38-encaisser','m','💶 Encaisser','Le bouton 💶 de la ligne : le reste est déjà rempli, on choisit CB, espèces, chèque… Paiement en plusieurs fois possible. Un invité offert ? On met 0.'],
  ['g39-pas-paye','tab','📋 Qui n’a pas payé ?','La liste des retardataires et le total à récupérer : à copier dans un message ou en Excel.'],
  ['g23-noel-programme','pg','Le programme','18:30 accueil, 19:30 repas, 21:00 le Père Noël 🎅…'],
  ['a5-evenement-docs','docs','📎 Les documents de la soirée','Permis feu, devis du traiteur, contrat de la salle… joints à l’événement. ✉️ pour les envoyer.'],
  ['a5-evenement-docs','join','Joindre un document','Il est aussi rangé dans 📁 Administratif, dans le dossier de ton choix.'],
  ['g25-affiche','aff','L’affiche 🖼','Style Noël choisi tout seul. Couleurs, textes, logo, photos : tout se déplace au doigt. Elle est partagée avec le groupe. <b>Impression possible</b> 🖨 : on regarde juste après.'],
  ['f7-onglets','tabs','🗂 L’affiche, rangée en onglets','À droite de l’affiche (en dessous sur téléphone) : <b>🎨 Style et fond</b>, <b>✏️ Textes</b>, <b>📲 QR codes</b>, <b>💶 Tarifs</b>, <b>🖼 Images</b>. Côté 📜 Menu, il y a aussi l’onglet <b>Le menu</b>. Un seul onglet ouvert à la fois : on s’y retrouve.'],
  ['f8-toucher','bc','👆 Touche un élément sur l’affiche','Touche le QR, l’encart des tarifs, le titre ou le menu directement sur l’affiche : <b>son onglet s’ouvre tout seul</b>, avec en haut sa <b>taille</b>, sa <b>rotation</b> et « ↺ Remettre à sa place ». On le déplace au doigt.'],
  ['f1-affiche-illus','style','✨ Les affiches illustrées','Onglet 🎨 Style et fond : <b>Noël féerique</b>, Galette des rois, Loto festif, Barbecue, Halloween, Soirée dansante. Ciel, guirlandes, panneau en bois, titre lumineux, ruban pour la date et 📍 pour le lieu : tout est dessiné par l’appli.'],
  ['f3-fond','fond','🌄 Ta propre image en fond','Une photo, ou une image créée par ChatGPT ou Gemini (<b>🤖 Préparer la demande pour ChatGPT</b> écrit le texte à leur donner). L’appli écrit le titre, la date et le lieu par-dessus. <b>📋 Coller une image copiée</b> marche aussi. <b>🖼 Mon image seule</b> : ton affiche déjà prête, telle quelle.'],
  ['f14-image-seule','pv','🖼 Mon image seule','Avec « Mon image seule », l’affiche (ou le menu) est <b>ton image</b>. Les QR codes et l’encart des tarifs se posent dessus, où tu veux.'],
  ['f14-recadrer','trim','✂️ Recadrer ton image','<b>Enlever les bandes noires ou blanches</b> (une capture d’écran, par exemple), puis <b>Zoom</b>, <b>Monter / descendre</b>, <b>Gauche / droite</b>. Les bandes unies sont même enlevées toutes seules quand tu choisis l’image.'],
  ['f2-menu','ocr','📜 L’affiche du menu','Touche <b>📜 Menu</b> : même décor, avec Apéro, Plat, Dessert, Enfants. Écris une rubrique par ligne finie par « : », puis les plats en dessous. <b>📷 Lire une photo du menu</b> recopie le texte d’une photo (à vérifier) ; sur iPhone, tu peux aussi copier le texte de la photo et le coller.'],
  ['f2b-menu-style','st','✍️ Le style du texte','Classique, ✨ Doré, ✍️ Manuscrit, Moderne, 🖍 Craie, ✦ ornements, et la taille du texte.'],
  ['f2b-menu-style','sync','🔄 Le menu et la fiche Repas','<b>Mettre à jour avec la fiche Repas</b> : les plats passent dans un sens et dans l’autre, sans doublon. Une sauce sur la même ligne que son plat : « atelier penne : sauces gorgonzola, cèpes, tomate ».'],
  ['f11-tarifs','fc','💶 4 prix possibles','Fiche de l’événement › 💶 Tarifs : <b>amicaliste</b>, <b>non-amicaliste</b>, <b>accompagnant d’un amicaliste</b> et <b>enfant</b>. Vide = même prix que l’adulte ; 0 = gratuit.'],
  ['f10-encart','px','💶 L’encart des tarifs','Onglet 💶 Tarifs › « Afficher les tarifs » : l’encart se met sur l’affiche ou le menu, avec les 4 prix. On le place au doigt.'],
  ['f10b-encart-reglages','z','🎨 Son style','Fond (sombre, blanc, couleur, sans fond), couleur du texte, style, bordure, taille jusqu’à 300 %, titre. Les prix suivent tout seuls ceux de la fiche.'],
  ['f4-pancarte','sign','🪧 La pancarte sur l’accueil','Avec un style illustré, la pancarte de l’affiche (titre, date, lieu) s’affiche sur l’accueil et en haut de la fiche de l’événement. Touche-la : l’événement s’ouvre ; touche-la encore : l’affiche et le menu.'],
  ['f16-qr-codes','dt','📲 Les QR codes de la soirée','Dans la fiche de l’événement : <b>Créer le QR code d’inscription</b>, puis la ligne <b>📲 QR codes</b> s’ouvre d’un toucher : l’inscription et le menu côte à côte, avec 👀 Voir, 🔗 Copier le lien, 💬 Envoyer.'],
  ['f6-qr-form','go','📝 Le formulaire','On scanne, on remplit : nom, prénom, adultes, enfants, téléphone, mail, amicaliste, régime. Les infos partent <b>chiffrées</b> : seuls les organisateurs peuvent les lire.'],
  ['f5-qr-event','pend','📥 À valider','Les inscriptions arrivent ici (et 🔔 notification). <b>✅ Ajouter</b> : l’appli vérifie d’abord (faute dans le nom, amicaliste ou pas, nouveau téléphone ou mail à reporter sur sa fiche), puis la personne rejoint les inscrits, <b>avec ses accompagnants et ses enfants</b>. 📜 Toutes les inscriptions reçues : rien ne se perd.'],
  ['f9-qr-menu','qm','🍽 Le QR du menu','Onglet 📲 QR codes : <b>QR du menu (menu + prix)</b>, avec sa forme, sa taille et son texte. On le pose sur l’affiche, à côté du QR d’inscription.'],
  ['f17-page-menu','pic','📱 Ce qu’on voit en scannant','La page du menu : ton menu tel que tu l’as fait (cadrage compris), à agrandir avec deux doigts. Elle se met à jour avec <b>✅ Enregistrer et fermer</b>.'],
  ['f17b-page-tarifs','tar','💶 Et les tarifs','En dessous, les prix en liste bien lisible sur téléphone : amicaliste, accompagnant, non-amicaliste, enfant.'],
  ['f15-envoyer-btn','send','📲 Envoyer depuis la fiche','Plus besoin d’ouvrir l’affiche : <b>📲 Envoyer l’affiche</b> dans la fiche de l’événement.'],
  ['f15-envoyer','a','Que veux-tu envoyer ?','<b>L’affiche</b> ou <b>le menu</b> en image, <b>un QR code seul</b> (avec son nom dessous), ou <b>seulement les liens</b>. Puis WhatsApp, Messages, mail…'],
  ['f12-partage','l','💬 Dans WhatsApp','Un QR code dans une image ne se touche pas : <b>Image + les liens</b> envoie aussi le lien d’inscription et celui du menu. Ils sont copiés : s’ils n’apparaissent pas sous l’image, colle-les.'],
  ['f12b-liens','b','🔗 Seulement les liens','Au choix : le lien d’inscription, celui du menu, ou les deux. Pratique juste après l’image, pour ceux chez qui le QR ne marche pas.'],
  ['g28-impression','af','Imprimer : 4 documents 🖨','On a la possibilité d’imprimer <b>4 documents différents</b>, montrés sur les diapos suivantes : touche le bouton <span class="k">🖨 Imprimer · affiche · PDF</span> et choisis. Sur iPhone et iPad, on obtient un PDF à imprimer ou à envoyer.'],
  ['p1-affiche','*','🖼 L’affiche à placarder','Format A4, en couleurs ou en noir et blanc. Prête à imprimer et à afficher.'],
  ['p2-fiche','*','📄 La fiche complète','Description, programme et liste de préparation avec les responsables : pour la réunion ou le classeur.'],
  ['p3-programme','*','🕐 Le programme seul','À afficher à l’entrée ou à donner aux bénévoles.'],
  ['p4-preparation','*','✅ La liste de préparation','Les cases à cocher, avec qui fait quoi : pour le jour de l’installation.'],
  ['g26-agenda-noel','j19','Dans l’agenda 📅','Rien à recopier : la soirée apparaît dans l’agenda du groupe le samedi 19.'],
  ['e0-bouton-jourj','jj','Où on clique pour le Jour J','Dans la fiche de l’événement : le bouton <span class="k">🎟 Page Jour J (distribution)</span>. C’est la page à ouvrir le soir même.'],
  ['g24-jour-j','stats','Le soir même : Jour J','En haut : ce qu’il reste à donner (repas, boissons, cadeaux).'],
  ['g24-jour-j','onglets','Trouver quelqu’un','Recherche, grade, régime, onglets Amicalistes / Non-amicalistes / Terminés.'],
  ['g24-jour-j','p1','Un appui par ticket','« Arrivé 1/2, 2/2 » pour un couple. Tout remis : la personne passe dans « Terminés ». Plusieurs téléphones en même temps !'],
  ['f13-jourj-enfants','row','👥 Inscrits par QR avec enfants','Un ticket par personne, adultes et enfants. Sous le nom : <b>le calcul du prix</b> (« non-amicaliste 40 € + 1 enfant × 10 € = 50 € ») et 💶 pour encaisser.']]},
  ['e3-jourj-encaisser','euro','💶 Encaisser sans quitter la page','À côté des tickets, le bouton 💶 : rouge = à payer, orange = reste à payer, vert = payé.'],
  ['e3-jourj-encaisser','cpt','Le compteur « Payé »','En haut : « Payé 5/10 » et ce qu’il reste à encaisser, en euros.'],
 {em:'🥪',t:'Le repas du midi',p:'Un exemple simple : croque-monsieur et boisson pour tous les inscrits. L’appli fait la liste de courses toute seule.',s:[
  ['r1-croque','nb','👥 Combien de repas ?','Chaque inscrit avec un ticket repas compte : ici 13 repas. On peut aussi taper le nombre.'],
  ['r2-croque-plat','ing','Le plat, pour UNE personne','Un croque-monsieur = 2 tranches de pain de mie, 1 tranche de jambon, 1 tranche de fromage. « Pour combien de personnes » : 1.'],
  ['r2-croque-plat','fo','Le même pour tout le monde','C’est nous qui choisissons : jambon-fromage pour tous… sauf les régimes particuliers.'],
  ['r1-croque','rg','⚠️ Les régimes','Repérés tout seuls dans les fiches : halal, végétarien, allergie… avec les noms.'],
  ['r1-croque','var','Leur variante','Un croque fromage, seulement pour eux (3 personnes).'],
  ['r1-croque','plat','× le nombre d’inscrits','10 croques jambon-fromage : les quantités sont déjà multipliées.'],
  ['r3-croque-envoi','liste','🛒 La liste de courses','26 tranches de pain de mie, 10 de jambon, 16 de fromage, 13 canettes : tout est additionné.'],
  ['r3-croque-envoi','ok','Envoyer','Elle part dans les courses du groupe. Une nouvelle inscription ? On renvoie : les quantités se mettent à jour, sans doublon.'],
  ['r4-croque-courses','art','Dans les courses','Celui qui va au magasin coche au fur et à mesure.'],
  ['a20-ev-badges','bg','🪪 La demande de repas','« Badges des inscrits » : les numéros de badge de ceux qui mangent.'],
  ['a21-ev-liste','tab','Les badges du repas','À copier dans la demande. Les invités sans badge sont signalés en bas.'],
  ['a20-ev-badges','fill','Inscriptions sur Excel ?','« Compléter une liste Excel » : l’appli complète le fichier et ajoute les personnes aux inscrits.']]},
 {em:'📝',t:'Le bilan de la réunion',p:'Le secrétaire écrit, tout le bureau retrouve.',s:[
  ['g27-note-bilan','titre','Une note propre','Onglet <span class="k">Notes</span>. Auteur et date en dessous. Bureau seulement 🔒'],
  ['g27-note-bilan','dec','Facile à écrire','Une ligne avec <b>#</b> = un titre, avec <b>-</b> = une puce. S’imprime et se partage.']]}

  ['a2-ajout','ev','Le lier à un événement','Facultatif : il apparaît aussi dans la fiche de la soirée (📎 Documents).'],
  ['a1-liste','chips','Les dossiers','Une pastille par dossier pour retrouver vite : statuts, AG, assurance, préfecture et mairie…'],
  ['a4-dossiers','perso','Vos propres dossiers','Ici « Soirée de Noël », créé par le bureau : chacun range comme il veut.'],
