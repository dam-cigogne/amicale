<style>
:root{--ac:#7c3aed;--ac2:#a78bfa;--y:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1f1830;background:radial-gradient(circle at 20% 10%,#7c3aed 0,#4c1d95 45%,#1e1238 100%);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bg span{position:absolute;font-size:2rem;opacity:.12;animation:fl 18s linear infinite}
@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
#top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + .5rem) .8rem .4rem;display:flex;align-items:center;gap:.5rem;color:#fff}
#chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:2rem;padding:.25rem .7rem;font-weight:800;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
#bar{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--y),#fb7185);transition:width .35s}
.ib{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:.8rem;min-width:2.3rem;height:2.3rem;font-size:1.05rem;font-weight:800;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 3.2rem) 1rem calc(env(safe-area-inset-bottom) + 4.2rem)}
#phone{position:relative;height:100%;aspect-ratio:390/844;max-width:100%;border-radius:2.2rem;background:#111;padding:.55rem;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.12) inset}
#scr{position:relative;width:100%;height:100%;border-radius:1.7rem;overflow:hidden;background:#fff}
#zw{position:absolute;left:0;top:0;width:100%;aspect-ratio:390/844;transition:transform .45s ease}
#zw.paper{aspect-ratio:794/1123;background:#fff}#zw.paper img{object-fit:contain;object-position:top}
body.paperon:not(.crop) #phone{aspect-ratio:794/1123;padding:0;background:none;border-radius:.3rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
body.paperon:not(.crop) #scr{border-radius:.3rem}
#scr img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:opacity .25s}
#hole{position:absolute;border-radius:.8rem;box-shadow:0 0 0 9999px rgba(20,8,40,.55);transition:all .45s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
#hole:after{content:"";position:absolute;inset:-6px;border:3px solid var(--y);border-radius:1rem;animation:pu 1.4s ease-out infinite}
@keyframes pu{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
#bub{position:fixed;z-index:15;width:min(330px,92%);background:#fff;border-radius:1.1rem;padding:.8rem .9rem .7rem;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:all .45s cubic-bezier(.3,1.3,.5,1);animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#bub:before{content:"";position:absolute;left:var(--tx,50%);width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg)}
#bub.dn:before{top:-7px}#bub.up:before{bottom:-7px}
#bub.lf:before{left:-7px;top:var(--ty,50%);transform:translateY(-50%) rotate(45deg)}
/* paysage (iPad couché, ordinateur, vidéoprojecteur) : bulle à côté du téléphone, textes plus grands */
body.land #phone{margin-right:min(44vw,700px)}
/* téléphone couché (écran bas) : l'écran de l'appli devient une fenêtre zoomée sur la zone montrée */
body.crop #stage{padding:calc(env(safe-area-inset-top) + .6rem) .6rem calc(env(safe-area-inset-bottom) + .6rem) calc(env(safe-area-inset-left) + .6rem);justify-content:flex-start}
body.crop #phone{aspect-ratio:auto;height:100%;width:58vw;margin-right:0;border-radius:1rem;padding:0;background:none;box-shadow:0 12px 40px rgba(0,0,0,.45)}
body.crop #scr{border-radius:1rem}
body.crop #hint{display:none}
body.crop #top{left:auto;right:calc(env(safe-area-inset-right) + .5rem);top:auto;bottom:calc(env(safe-area-inset-bottom) + .4rem);padding:0;width:auto}
body.crop #chip,body.crop #bar{display:none}
body.crop #top .ib{min-width:2rem;height:2rem;font-size:.9rem}
body.crop #fs{display:none}
body.crop #bub{width:calc(42vw - 2.2rem);padding:1rem 1.1rem;border-radius:1.2rem}
body.crop #bub h3{font-size:clamp(1.1rem,5.2vh,1.6rem)}body.crop #bub p{font-size:clamp(.95rem,4.2vh,1.25rem)}
#bub .ch{display:none}

/* le cadre jaune s'agrandit doucement à chaque étape */
#hole.grow{animation:grow .6s cubic-bezier(.3,1.4,.5,1)}

body.land #bub{width:min(40vw,640px);padding:1.2rem 1.4rem 1.1rem;border-radius:1.4rem}
body.land #bub h3{font-size:clamp(1.15rem,3.2vh,2.2rem);margin-bottom:.4rem}
body.land #bub p{font-size:clamp(1rem,2.6vh,1.75rem);line-height:1.4}
body.land #bub .who{font-size:.6em}

body.land #cnt{font-size:clamp(.8rem,1.8vh,1.2rem)!important}

body.land #stage{padding-bottom:calc(env(safe-area-inset-bottom) + clamp(4.2rem,9vh,6rem))}
body.land .card .em{font-size:clamp(5rem,15vh,10rem)}
body.land .card h1{font-size:clamp(2.1rem,7vh,4.6rem)}
body.land .card p{font-size:clamp(1rem,3vh,1.9rem);max-width:min(70vw,60rem)}
body.land .card .go{font-size:clamp(1.05rem,2.8vh,1.8rem);padding:.8em 1.6em}
body.land .card .sm{font-size:clamp(.8rem,1.9vh,1.2rem)}
body.land .card .lnk a{font-size:clamp(.95rem,2.3vh,1.5rem)}

#bub b{color:#5b21b6}#bub .who{display:inline-block;font-size:.72rem;font-weight:800;background:#ede9fe;color:#6d28d9;border-radius:.4rem;padding:0 .35rem;margin-left:.25rem;vertical-align:2px}
#bub .k{display:inline-block;background:#ede9fe;color:#5b21b6;font-weight:800;border-radius:.35rem;padding:0 .3rem}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + .7rem);z-index:20;display:flex;justify-content:center;gap:.6rem}
#hint .ib{min-width:7.5rem;height:2.8rem;font-size:1rem}
#hint .nx{background:var(--y);color:#3b0764;border-color:var(--y)}
.card{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:2rem;background:radial-gradient(circle at 50% 30%,rgba(124,58,237,.96),rgba(30,18,56,.98));animation:fade .35s}

.card .em{font-size:5rem;animation:bounce 1.6s ease-in-out infinite}

.card h1{font:italic 800 2.1rem/1.15 "New York",ui-serif,Georgia,serif;margin:.6rem 0 .4rem}

.card .lnk{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}
.card .lnk a{color:#fff;font-weight:800;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:.8rem;padding:.55rem .9rem}

#menu.on{display:flex}
#menu .box{background:#fff;border-radius:1.2rem;padding:1rem;width:min(420px,100%);max-height:85vh;overflow:auto}

.conf{position:fixed;top:-3rem;font-size:1.8rem;z-index:35;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media(min-width:900px){#stage{padding-left:2rem;padding-right:2rem}}

 let left=mx-bw/2;left=Math.max(r.left+8,Math.min(r.right-bw-8,left));

 if(below&&top+bh>r.bottom-6)top=Math.max(r.top+6,mt-bh-14);if(!below&&top<r.top+6)top=Math.min(r.bottom-bh-6,mb+14);

{const E=['🎄','🎁','📅','🛒','✍️','🎉','👥','⭐'];let h='';for(let k=0;k<14;k++)h+='<span style="left:'+(k*7.3)%100+'vw;animation-delay:-'+(k*1.3)+'s;animation-duration:'+(14+k%5*3)+'s">'+E[k%E.length]+'</span>';$('#bg').innerHTML=h}
