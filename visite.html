<style>
:root{--ac:#7c3aed;--ac2:#a78bfa;--y:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1f1830;background:radial-gradient(circle at 20% 10%,#7c3aed 0,#4c1d95 45%,#1e1238 100%);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bg span{position:absolute;font-size:2rem;opacity:.12;animation:fl 18s linear infinite}
@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
#top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + .5rem) .8rem .4rem;display:flex;align-items:center;gap:.5rem;color:#fff}
#chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:2rem;padding:.25rem .7rem;font-weight:800;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
#bar{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--y),#fb7185);transition:width .35s}
.ib{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:.8rem;min-width:2.3rem;height:2.3rem;font-size:1.05rem;font-weight:800;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 3.2rem) 1rem calc(env(safe-area-inset-bottom) + 4.2rem)}
#phone{position:relative;height:100%;aspect-ratio:390/844;max-width:100%;border-radius:2.2rem;background:#111;padding:.55rem;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.12) inset}
#scr{position:relative;width:100%;height:100%;border-radius:1.7rem;overflow:hidden;background:#fff}
#zw{position:absolute;left:0;top:0;width:100%;aspect-ratio:390/844;transition:transform .45s ease}
#zw.paper{aspect-ratio:794/1123;background:#fff}#zw.paper img{object-fit:contain;object-position:top}
body.paperon:not(.crop) #phone{aspect-ratio:794/1123;padding:0;background:none;border-radius:.3rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
body.paperon:not(.crop) #scr{border-radius:.3rem}
#scr img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:opacity .25s}
#hole{position:absolute;border-radius:.8rem;box-shadow:0 0 0 9999px rgba(20,8,40,.55);transition:all .45s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
#hole:after{content:"";position:absolute;inset:-6px;border:3px solid var(--y);border-radius:1rem;animation:pu 1.4s ease-out infinite}
@keyframes pu{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
#bub{position:fixed;z-index:15;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-transform:translateZ(0);isolation:isolate;width:min(330px,92%);background:#fff;border-radius:1.1rem;padding:.8rem .9rem .7rem;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:all .45s cubic-bezier(.3,1.3,.5,1);animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#bub:before{content:"";position:absolute;left:var(--tx,50%);width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg)}
#bub.dn:before{top:-7px}#bub.up:before{bottom:-7px}
#bub.lf:before{left:-7px;top:var(--ty,50%);transform:translateY(-50%) rotate(45deg)}
/* paysage (iPad couché, ordinateur, vidéoprojecteur) : bulle à côté du téléphone, textes plus grands */
body.land #phone{margin-right:min(44vw,700px)}
/* téléphone couché (écran bas) : l'écran de l'appli devient une fenêtre zoomée sur la zone montrée */
body.crop #stage{padding:calc(env(safe-area-inset-top) + .6rem) .6rem calc(env(safe-area-inset-bottom) + .6rem) calc(env(safe-area-inset-left) + .6rem);justify-content:flex-start}
body.crop #phone{aspect-ratio:auto;height:100%;width:58vw;margin-right:0;border-radius:1rem;padding:0;background:none;box-shadow:0 12px 40px rgba(0,0,0,.45)}
body.crop #scr{border-radius:1rem}
body.crop #hint{display:none}
body.crop #top{left:auto;right:calc(env(safe-area-inset-right) + .5rem);top:auto;bottom:calc(env(safe-area-inset-bottom) + .4rem);padding:0;width:auto}
body.crop #chip,body.crop #bar{display:none}
body.crop #top .ib{min-width:2rem;height:2rem;font-size:.9rem}
body.crop #fs{display:none}
body.crop #bub{width:calc(42vw - 2.2rem);padding:1rem 1.1rem;border-radius:1.2rem}
body.crop #bub h3{font-size:clamp(1.1rem,5.2vh,1.6rem)}body.crop #bub p{font-size:clamp(.95rem,4.2vh,1.25rem)}
#bub .ch{display:none}
body.land #bub .ch{display:block;font-size:.75em;font-weight:800;color:#a78bfa;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.2rem}

#hole.grow{animation:grow .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes grow{from{transform:scale(1.35);opacity:0}to{transform:scale(1);opacity:1}}

body.land #bub h3{font-size:clamp(1.15rem,3.2vh,2.2rem);margin-bottom:.4rem}
body.land #bub p{font-size:clamp(1rem,2.6vh,1.75rem);line-height:1.4}
body.land #bub .who{font-size:.6em}

body.land #cnt{font-size:clamp(.8rem,1.8vh,1.2rem)!important}
body.land #hint .ib{font-size:clamp(1rem,2.2vh,1.5rem);height:clamp(2.8rem,6vh,4rem);min-width:clamp(7.5rem,14vw,13rem)}
body.land #stage{padding-bottom:calc(env(safe-area-inset-bottom) + clamp(4.2rem,9vh,6rem))}

body.land .card h1{font-size:clamp(2.1rem,7vh,4.6rem)}
body.land .card p{font-size:clamp(1rem,3vh,1.9rem);max-width:min(70vw,60rem)}
body.land .card .go{font-size:clamp(1.05rem,2.8vh,1.8rem);padding:.8em 1.6em}
body.land .card .sm{font-size:clamp(.8rem,1.9vh,1.2rem)}
body.land .card .lnk a{font-size:clamp(.95rem,2.3vh,1.5rem)}

#bub b{color:#5b21b6}#bub .who{display:inline-block;font-size:.72rem;font-weight:800;background:#ede9fe;color:#6d28d9;border-radius:.4rem;padding:0 .35rem;margin-left:.25rem;vertical-align:2px}
#bub .k{display:inline-block;background:#ede9fe;color:#5b21b6;font-weight:800;border-radius:.35rem;padding:0 .3rem}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + .7rem);z-index:20;display:flex;justify-content:center;gap:.6rem}
#hint .ib{min-width:7.5rem;height:2.8rem;font-size:1rem}
#hint .nx{background:var(--y);color:#3b0764;border-color:var(--y)}
.card{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:2rem;background:radial-gradient(circle at 50% 30%,rgba(124,58,237,.96),rgba(30,18,56,.98));animation:fade .35s}

.card p{max-width:30rem;opacity:.92;margin:.2rem 0}
.card .go{margin-top:1.4rem;background:var(--y);color:#3b0764;font-weight:900;border:0;border-radius:1rem;padding:.8rem 1.6rem;font-size:1.05rem;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}

.card .lnk{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}
.card .lnk a{color:#fff;font-weight:800;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:.8rem;padding:.55rem .9rem}

#menu.on{display:flex}
#menu .box{background:#fff;border-radius:1.2rem;padding:1rem;width:min(420px,100%);max-height:85vh;overflow:auto}
#menu h3{margin:0 0 .5rem;color:#4c1d95}#menu button{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;background:#f5f3ff;border:0;border-radius:.8rem;padding:.65rem .8rem;margin:.3rem 0;font:inherit;font-weight:700;color:#2e1065;cursor:pointer}

.conf{position:fixed;top:-3rem;font-size:1.8rem;z-index:35;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media(min-width:900px){#stage{padding-left:2rem;padding-right:2rem}}

 {em:'👋',t:'Bienvenue dans Amicale',p:'L’appli de ton groupe : membres, agenda, tâches, courses, événements, bulletins d’adhésion. Suis la visite : touche l’écran (ou la flèche ›) pour avancer.'},
 {em:'🔒',t:'Tes données sont chiffrées',p:'Les échanges du groupe sont illisibles pour tout le monde, sauf les membres. Pas de compte, pas de publicité, pas de revente. Garde ton téléphone verrouillé et ne partage jamais le code d’invitation.'},
 {em:'📲',t:'Installe l’appli sur ton téléphone',p:'<b>iPhone</b> : ouvre le lien dans <b>Safari</b> (pas dans un autre navigateur), touche Partager (le carré avec une flèche), « Sur l’écran d’accueil », puis Ajouter.<br><b>Android</b> : ouvre le lien dans <b>Chrome</b>, Menu ⋮ › Installer l’application, confirme.<br>Ensuite, lance l’appli depuis son icône : elle marche aussi sans connexion.'},
 {em:'📩',t:'Rejoindre le groupe',p:'Paul, le président, invite Claire au bureau. En 1 minute, elle a sa fiche.',s:[
  ['g01-inviter','bureau','Choisir le niveau','<b>Paul</b><span class="who">admin</span> invite quelqu’un. <b>Bureau</b> : voit tout.'],
  ['g01-inviter','aide','Ou « Aide extérieur »','Les aides voient seulement ce qu’on partage avec eux : pas les amicalistes, pas les bulletins d’adhésion, pas les notes.'],
  ['g02-code','code','Un code secret','8 caractères, valable 7 jours, pour <b>une seule</b> personne.'],
  ['g02-code','sms','Envoyer par SMS','Le message contient le lien de l’appli Amicale et le code. 📲'],
  ['g03-accueil','join','Claire reçoit le SMS','Elle installe l’appli avec le lien, puis touche <b>Rejoindre avec un code</b>.'],
  ['g04-saisie-code','code','Elle tape le code','Ou elle colle tout le SMS : l’appli trouve le code toute seule. 🪄'],
  ['g05-fiche','nom','Sa fiche','Son nom tel qu’il apparaîtra. Téléphone et mails : facultatifs.'],
  ['g05-fiche','ok','Rejoindre !','C’est tout. Les échanges du groupe sont <b>chiffrés</b> 🔒'],
  ['g06-membres','claire','Paul la voit arriver','Il touche sa fiche pour lui donner un <b>titre</b> (secrétaire, trésorière…), l’appeler ou lui écrire.'],
  ['g32-lier','lier','📲 Plusieurs appareils','Chacun peut avoir l’appli sur son téléphone, son iPad et son PC : ⚙ › « Lier un autre appareil ». C’est toi, mêmes droits. Dans AgenDam, le même code relie aussi ton agenda perso.'],
  ['g33-lier-code','dlg','Le code de liaison','Sur l’autre appareil : ouvre Amicale › « Rejoindre avec un code », tape ce code. Tout se synchronise tout seul. Code personnel, 15 minutes : ne le donne à personne.']]},
 {em:'🎖',t:'Les amicalistes',p:'La liste des adhérents : importer votre fichier, inscrire, faire signer le bulletin d’adhésion, retrouver les numéros de badge.',s:[
  ['a17-am-outils','imp','📥 Votre fichier Excel','Importé tel quel : grades abrégés (SGC, ADC…), badge, paiement, « 29/07 DAMIEN », patch OK. Réimporter met à jour, sans doublon.'],
  ['a17-am-outils','dbl','🧹 Retirer les doublons','Deux fiches pour la même personne ? Une seule est gardée, avec toutes les infos.'],
  ['g07-ajout-amicaliste','nom','Nouvel amicaliste','Onglet <span class="k">Amicalistes</span> › <span class="k">+ Ajouter</span>. Nom en MAJUSCULES, c’est plus lisible.'],
  ['g07-ajout-amicaliste','grade','Grade, catégorie…','Grade, catégorie, adhésion, cotisation, patch… et en bas « faire signer le bulletin d’adhésion ».'],
  ['a22-fiche-badge','bg','Dans la fiche','N° de badge, payée le, encaissé par (rempli tout seul quand on encaisse), service, régime.'],
  ['e4-fiche-contact','tel','📞 Téléphone et ✉️ mail','Dans la fiche de l’amicaliste (Modifier) : son téléphone et son mail. Ils s’affichent sous son nom, pour l’appeler ou lui écrire.'],
  ['g07-ajout-amicaliste','regime','Régime particulier','Halal, végétarien, allergie : il ressortira en orange dans les repas. 🍽'],
  ['g08-signature','prix','Le prix se calcule tout seul','D’après le grade : les tarifs sont réglés <b>une fois</b> par l’administrateur pour tout le bureau.'],
  ['g08-signature','pm','Le règlement','Carte, espèces, chèque ou virement.'],
  ['g08-signature','sig','Signature au doigt ✍️','On tend le téléphone, il signe. « Effacer » pour recommencer.'],
  ['g08-signature','ok','Valider','Le bulletin d’adhésion est rangé dans la fiche et envoyé au bureau (pas aux aides). Ensuite : envoyer, imprimer ou enregistrer le PDF.'],
  ['g09-amicaliste-signe','fiche','Et voilà !','« cotisation ✓ 20 € (CB) · bulletin d’adhésion ✓ · <b>inscrit par Claire Moreau</b> ». On sait qui a fait quoi.'],
  ['a17-am-outils','bg','🪪 Numéros de badge','On peut extraire le numéro de badge de <b>tous les amicalistes</b>, de <b>ceux inscrits à un événement</b>, ou de <b>ceux qui ont payé leur cotisation</b>.'],
  ['a18-badges','tab','Le listing','Nom, prénom, grade, N° de badge. En orange : ceux qui n’ont pas de badge.'],
  ['a18-badges','copy','📋 Copier','Les numéros à coller dans la demande de repas. Ou 📊 Excel, ou 🖨 imprimer.'],
  ['a17-am-outils','fill','📋 Compléter une liste Excel','Exemple : pour un repas, les gens s’inscrivent sur un Excel avec seulement NOM et Prénom.'],
  ['a34-fill-intro','dlg','On donne le fichier à l’appli','Elle retrouve chaque personne dans la liste des amicalistes, même si le nom est écrit dans le désordre ou sans accents.'],
  ['a33-fill-ok','dlg','Un Excel complet','Elle ajoute pour chacun : grade, N° de badge, amicaliste oui/non, cotisation payée, régime, service. Ceux qu’elle ne trouve pas sont signalés. Prêt pour la demande de repas.']]},
 {em:'🗄',t:'Archiver les bulletins d’adhésion',p:'Une fois par an, l’administrateur range tous les bulletins d’adhésion signés dans un seul fichier.',s:[
  ['g11-archiver','zip','Un ZIP de PDF','Un PDF par personne, nommé <b>NOM-Prénom</b>. Sur iPhone : « Enregistrer dans Fichiers ».'],
  ['g12-liberer','lib','Libérer la place','Seulement quand le ZIP est bien rangé : les signatures quittent tous les téléphones.'],
  ['g13-archive','fiche','La fiche reste','Elle garde « 📝 bulletin d’adhésion archivé ». La liste ne perd rien.']]},
 {em:'🛒',t:'Tâches et courses',p:'Qui fait quoi ? Ça se voit d’un coup d’œil.',s:[
  ['g14-taches','add','Une tâche','Quoi, <b>pour qui</b> 👤, pour quand 📅, bureau seulement 🔒 ou tout le monde.'],
  ['g14-taches','t1','Qui s’en occupe','👤 la personne chargée, ✍️ celle qui l’a écrite.'],
  ['g14-taches','done','Faites ✅','On coche, elle passe dans « Faites » avec le nom de celui qui l’a cochée.'],
  ['g15-courses','plus','Les courses','Plusieurs listes (Courses, Buvette, Local…), rangées par rayon, quantités avec − et +.'],
  ['g15-courses','done','Dans le chariot 🛒','Au magasin on coche : « ✅ Luc Martin ». Personne n’achète deux fois la même chose !']]},
 {em:'🎄',t:'La soirée de Noël',p:'De la préparation au soir même : inscrits, argent, régimes, cadeaux, affiche, Jour J.',s:[

  ['g17-noel-preparation','infos','Les infos','Date, lieu, description, visible par le bureau seul ou aussi par les aides.'],
  ['g17-noel-preparation','fait','La préparation','Chaque ligne a son responsable. Quand c’est fait : « ✅ <b>fait par Luc Martin</b> » et l’heure.'],
  ['e6-taches-selection','bar','☑ Sélectionner des tâches','Dans la préparation : on touche ☑ Sélectionner des tâches, on coche plusieurs lignes. En haut : le nombre choisi, « Tout » ou « Aucune ».'],
  ['e6-taches-selection','don','👤 Donner à…','Confier toutes les tâches choisies à une même personne, en une fois.'],
